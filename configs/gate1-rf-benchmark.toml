# Frozen source-faithful helper rerun, not recovery of the historical RNG states.
# Uses native downloader, prepare_data, feature helpers and prepare_model.
# Seed Python/NumPy once per repeated holdout; no estimator overrides.
upstream_revision = "97f5b9f58d9e445a8ecb0218037af7465c3708c0"
loader_key = "Huesken"
benchmark_alias = "siRNA1"
seeds = [0, 1, 2, 3, 4]
