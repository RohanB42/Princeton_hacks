[tool.poetry]
name = "oligo-design-engine"
version = "0.1.0"
description = "Documentation-only scaffold for an open-data oligonucleotide research project"
packages = [{ include = "oligo_engine", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"
pytest = "^8.4.0"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
